name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - Dockerfile
              - 'docker-compose*.yml'
              - docker-entrypoint.sh
              - .dockerignore

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter web exec prisma generate

      - name: Web tests
        run: pnpm --filter web test

      - name: Web lint
        run: pnpm --filter web lint

      - name: Web build
        run: pnpm --filter web build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: file:./prisma/ci-build.db
          JWT_SECRET: ci-build-jwt-secret-minimum-32-characters

  packages:
    name: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Workspace package tests
        run: |
          pnpm --filter @johel/resume test
          pnpm --filter @johel/jd-meta test

  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.docker == 'true' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Verify Docker image build
        run: docker buildx build --platform linux/arm64 -f Dockerfile --load .

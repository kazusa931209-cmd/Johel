services:
  app:
    build:
      context: .
      platforms:
        - linux/arm64
    image: johel:local
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "4444:4444"
    environment:
      DATABASE_URL: file:/data/johel.db
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-docker}
      HOST: "127.0.0.1"
      PORT: "4042"
      WEB_PORT: "4444"
      API_ORIGIN: http://127.0.0.1:4042
      HOSTNAME: "0.0.0.0"
    volumes:
      - johel-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4444/backend/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  johel-data:
